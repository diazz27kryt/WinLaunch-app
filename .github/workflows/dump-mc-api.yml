name: Dump MC API
on:
  push:
    branches: [api-dump]
permissions:
  contents: write
jobs:
  dump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: genSources
        working-directory: win-visuals
        run: gradle genSources --no-daemon
      - name: Collect
        run: |
          SRC=$(find ~/.gradle -name '*-sources.jar' | grep -i 'minecraft' | head -n 3)
          echo "SRC=$SRC"
          rm -rf apidump && mkdir -p apidump/src apidump/fabric
          for f in $SRC; do
            unzip -q -o "$f" 'net/minecraft/client/*' 'com/mojang/blaze3d/*' 'net/minecraft/resources/*' 'net/minecraft/core/particles/*' 'net/minecraft/world/level/MoonPhase*' 'net/minecraft/world/InteractionResult*' -d apidump/src || true
          done
          du -sh apidump/src
          FJ=$(find ~/.gradle -name '*.jar' ! -name '*-sources.jar' | grep -E 'fabric-(rendering-v1|key-binding-api-v1|events-interaction-v0|lifecycle-events-v1)' )
          echo "$FJ" > apidump/fabric/jars.txt
          for j in $FJ; do
            unzip -l "$j" | awk '{print $4}' | grep '\.class$' >> apidump/fabric/classes.txt
          done
          CP=$(echo "$FJ" | tr '\n' ':')
          for c in net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper net.fabricmc.fabric.api.event.player.AttackEntityCallback net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents; do
            javap -cp "$CP" "$c" >> apidump/fabric/javap.txt 2>&1 || echo "MISSING $c" >> apidump/fabric/javap.txt
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apidump
          git commit -qm "api dump [skip ci]"
          git push
