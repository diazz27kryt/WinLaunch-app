name: Dump MC API
on:
  push:
    branches: [api-dump]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: genSources
        working-directory: win-visuals
        run: gradle genSources --no-daemon
      - name: Collect
        run: |
          mkdir -p out
          SRC=$(find ~/.gradle ~/.cache -name '*-sources.jar' -path '*minecraft*' 2>/dev/null | head -n 5)
          echo "$SRC"
          for f in $SRC; do cp "$f" out/; done
          find ~/.gradle ~/.cache -name 'fabric-api*.jar' -o -name 'fabric-*-v1-*.jar' 2>/dev/null | head -100 > out/fabric-jars.txt || true
          mkdir -p out/fabric
          find ~/.gradle ~/.cache -name 'fabric-*.jar' ! -name '*-sources.jar' 2>/dev/null | grep -E 'fabric-(rendering|key-binding|events-interaction|lifecycle-events|resource-loader)' | while read j; do cp "$j" out/fabric/; done
          ls -la out out/fabric
      - uses: actions/upload-artifact@v4
        with:
          name: mc-api
          path: out
