name: Build Win Visuals

# Builds the Win Visuals Fabric mod (Minecraft 1.21.11) and commits the jar into the launcher assets,
# where WinVisualsBundle picks it up when generating the WinLaunch packs. The 1.21.1 build is kept
# as win-visuals-1.21.1.jar and is not touched by this workflow.
on:
  push:
    paths:
      - 'win-visuals/**'
      - '.github/workflows/build-win-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        working-directory: win-visuals
        run: gradle build --no-daemon

      - name: Copy jar into launcher assets
        run: |
          JAR=$(find win-visuals/build/libs -name 'win-visuals-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          mkdir -p ZalithLauncher/src/main/assets/winvisuals
          cp "$JAR" ZalithLauncher/src/main/assets/winvisuals/win-visuals-1.21.11.jar

      - uses: actions/upload-artifact@v4
        with:
          name: win-visuals
          path: ZalithLauncher/src/main/assets/winvisuals/win-visuals-1.21.11.jar

      - name: Commit jar
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ZalithLauncher/src/main/assets/winvisuals/win-visuals-1.21.11.jar
          if git diff --cached --quiet; then
            echo "Jar unchanged"
          else
            git commit -m "Build Win Visuals jar [skip ci]"
            git push
          fi
