# launcher name & url
# NOTE: this is an unofficial modified version of Zalith Launcher 2 (GPL-3.0), see NOTICE.md.
launcher_name=WinLaunch
launcher_app_name=WinLaunch
launcher_short_name=WL
url_home=https://github.com/diazz27kryt/winlaunch-app

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# Keystore passwords of the *debug* keystore (winlaunch_debug.jks). A debug key is public by design.
# Release signing uses winlaunch_release.jks with the STORE_PASSWORD / KEY_PASSWORD environment variables.
default_store_password=winlaunch-debug
default_key_password=winlaunch-debug

# launcher version
launcher_version_code=1
launcher_version_name=0.1.0

# WinLaunch does not bundle the proprietary Zalith legal documents (see NOTICE.md).
